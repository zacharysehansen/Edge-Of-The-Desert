# Ticket 02: source data for the largest area the diorama could cover.
# The box holds the crests of all four ranges plus about 5 km beyond each:
#   Tucson Mountains crest (Wasson Peak, about -111.15)  -> west  -111.25
#   Rincon crest (Mica Mountain, about -110.54)          -> east  -110.45
#   Santa Catalina crest (Mount Lemmon, about 32.44)     -> north  32.52
#   Santa Rita crest (Mount Wrightson, about 31.70)      -> south  31.62
# Every extent in the team questionnaire is a crop of this box.

[superset]
west = -111.25
east = -110.45
south = 31.62
north = 32.52

[dem]
# 1/3 arc-second 3DEP, published as 1x1 degree tiles named by their north-west corner.
tile_url = "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/{name}/USGS_13_{name}.tif"
tiles_dir = "data/raw/dem/tiles"
merged_path = "data/processed/terrain/dem_utm12n.tif"
resolution_m = 10.0

[imagery]
# NAIP aerial imagery via Microsoft Planetary Computer (public domain, no account needed).
stac_url = "https://planetarycomputer.microsoft.com/api/stac/v1/search"
token_url = "https://planetarycomputer.microsoft.com/api/sas/v1/token/naip"
items_dir = "data/raw/naip/items"
merged_path = "data/processed/terrain/naip_utm12n.tif"
resolution_m = 5.0
