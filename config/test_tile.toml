# Ticket 01 test tile: the Santa Catalina front around the mouth of Sabino Canyon.
# About 6 x 6 km of ground, which prints at about 200 mm square at 1:30,000.

[patch]
name = "catalina_front_sabino"
west = -110.840
east = -110.776
south = 32.290
north = 32.344

[print]
scale = 30000                # 1:30,000
vertical_exaggeration = 2.5
base_thickness_mm = 5.0
mesh_resolution_mm = 0.5     # spacing of the height samples on the printed model
bed_mm = 220.0

[source]
# 1/3 arc-second 3DEP DEM, the 1x1 degree tile covering 32-33 N, 110-111 W.
dem_url = "https://prd-tnm.s3.amazonaws.com/StagedProducts/Elevation/13/TIFF/current/n33w111/USGS_13_n33w111.tif"
dem_path = "data/raw/dem/catalina_front_sabino.tif"

[output]
dir = "outputs/terrain"
